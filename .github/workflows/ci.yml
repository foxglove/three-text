name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: yarn

      - run: yarn install --immutable

      - run: yarn run typecheck
      - run: yarn run lint:ci
      - run: yarn run build
      - run: yarn run test

      - name: Publish to NPM
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: yarn npm publish --provenance --access public

  storybook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: yarn

      - run: yarn install --immutable
      - run: yarn build-storybook

      - name: Deploy Storybook
        uses: foxglove/cloudflare-action@v1
        # Fork PRs do not have access to secrets. Tag pushes are skipped
        # because the action would treat the tag name as a preview branch.
        if: ${{ !github.event.pull_request.head.repo.fork && github.ref_type != 'tag' }}
        with:
          type: workers
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_THREE_TEXT_STORYBOOK }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
